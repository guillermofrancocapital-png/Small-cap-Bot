<style>
:root {
  --bg: #E8EDF0;
  --panel: #F6F8F9;
  --ink: #15232D;
  --muted: #5D6D78;
  --rule: #C9D3D9;
  --fund: #1C56A0;
  --bench: #8E9CA6;
  --bench2: #B9A27A;
  --other: #7C5BA6;
  --up: #1D7650;
  --down: #B0392C;
  --alpha: rgba(28, 86, 160, .12);
  --font: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101920; --panel: #16222B; --ink: #E4EAEE; --muted: #93A3AE; --rule: #2A3944;
    --fund: #6EA4EA; --bench: #6D7D88; --bench2: #A8925F; --other: #B79BDC; --up: #4FBF8A; --down: #EC7B6C;
    --alpha: rgba(110, 164, 234, .14);
  }
}
:root[data-theme="dark"] {
  --bg: #101920; --panel: #16222B; --ink: #E4EAEE; --muted: #93A3AE; --rule: #2A3944;
  --fund: #6EA4EA; --bench: #6D7D88; --bench2: #A8925F; --other: #B79BDC; --up: #4FBF8A; --down: #EC7B6C;
  --alpha: rgba(110, 164, 234, .14);
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
.stamp { color: var(--muted); font-size: .875rem; }
.demo { background: var(--panel); border-left: 3px solid var(--bench2); padding: 10px 14px; margin: 16px 0 0; font-size: .9rem; color: var(--muted); }

.hero { margin: 40px 0 8px; }
.verdict { font-size: clamp(2.4rem, 7vw, 4.6rem); font-weight: 800; line-height: 1.02; letter-spacing: -.025em; margin: 0; }
.verdict.up { color: var(--up); } .verdict.down { color: var(--down); }
.verdict-sub { font-size: 1.1rem; color: var(--muted); margin: 10px 0 0; max-width: 60ch; }

.figures { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 32px 0 0; border-top: 1px solid var(--rule); }
.figures div { padding: 14px 16px 0 0; }
.figures dt { color: var(--muted); font-size: .85rem; }
.figures dd { margin: 2px 0 0; font-size: 1.35rem; font-weight: 600; }

.chart-wrap { margin: 36px 0 0; background: var(--panel); padding: 18px 16px 10px; border-radius: 6px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; background: var(--c); }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

section { margin-top: 56px; }
.switch { display: inline-flex; gap: 4px; margin-top: 24px; background: var(--panel); padding: 4px; border-radius: 8px; }
.switch button { font: inherit; font-size: .95rem; border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
.switch button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.switch button:focus-visible { outline: 2px solid var(--fund); outline-offset: 2px; }
h3.sub { font-size: 1rem; font-weight: 600; margin: 28px 0 10px; }
.side.PEND { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
h2 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 0 0 18px; }

.today { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; }
.view { font-size: 1.1rem; line-height: 1.6; margin: 0; max-width: 60ch; }
.notes { color: var(--muted); margin-top: 14px; max-width: 60ch; }
.moves { list-style: none; margin: 0; padding: 0; }
.moves li { padding: 12px 0; border-top: 1px solid var(--rule); }
.moves li:first-child { border-top: 0; padding-top: 0; }
.mv-head { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.side { font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; }
.side.BUY, .side.ADD { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.side.SELL, .side.TRIM { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); }
.mv-reason { color: var(--muted); font-size: .92rem; margin-top: 2px; }
.empty { color: var(--muted); }

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td.num, th.num { text-align: right; }
td .tk { font-weight: 600; }
td .nm { color: var(--muted); }
.pos { color: var(--up); } .neg { color: var(--down); }
.wbar { display: inline-block; height: 6px; background: var(--fund); border-radius: 3px; vertical-align: middle; margin-left: 8px; opacity: .7; }
td.reason { white-space: normal; color: var(--muted); min-width: 260px; }
.auto { font-size: .75rem; color: var(--down); margin-left: 6px; }

@media (max-width: 760px) {
  .figures { grid-template-columns: repeat(2, 1fr); }
  .today { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .line-fund { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.2s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Fondos demo Small Caps EE. UU.</h1>
    <span class="stamp" id="stamp">Cargando…</span>
  </header>
  <div id="demo-note"></div>
  <div class="switch" role="tablist" aria-label="Fondo">
    <button role="tab" data-fund="calidad" aria-selected="true">Calidad + valor</button>
    <button role="tab" data-fund="catalizadores" aria-selected="false">Catalizadores</button>
  </div>

  <div class="hero">
    <p class="verdict" id="verdict">—</p>
    <p class="verdict-sub" id="verdict-sub"></p>
  </div>

  <dl class="figures" id="figures"></dl>

  <div class="chart-wrap">
    <div class="legend">
      <span style="--c: var(--fund)" id="lg-sel">Fondo</span>
      <span style="--c: var(--other)" id="lg-other">Otro fondo</span>
      <span style="--c: var(--bench)">S&amp;P 600 (IJR)</span>
      <span style="--c: var(--bench2)">Russell 2000 (IWM)</span>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 1000 320" role="img" aria-label="Evolución del fondo frente a los índices, base 100"></svg>
  </div>

  <section>
    <h2>Decisión de la última sesión</h2>
    <p class="lede" id="report-date"></p>
    <div class="today">
      <div>
        <p class="view" id="view"></p>
        <p class="notes" id="notes"></p>
      </div>
      <div>
        <ul class="moves" id="moves"></ul>
        <h3 class="sub" id="pending-title" hidden>Órdenes para la apertura de mañana</h3>
        <ul class="moves" id="pending"></ul>
      </div>
    </div>
  </section>

  <section>
    <h2>Cartera</h2>
    <p class="lede" id="port-lede"></p>
    <div class="table-scroll"><table id="positions"></table></div>
  </section>

  <section>
    <h2>Historial de operaciones</h2>
    <p class="lede">Las 60 más recientes, con el motivo de cada una.</p>
    <div class="table-scroll"><table id="trades"></table></div>
  </section>
</main>

<script>
const cfg = window.FUND_CONFIG;
const FUNDS = { calidad: "Calidad + valor", catalizadores: "Catalizadores" };
const fmtUSD = new Intl.NumberFormat("es-ES", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const fmtPx = v => v == null ? "—" : v.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " $";
const fmtPct = (v, sign = true) => (v == null || isNaN(v)) ? "—" :
  (sign && v > 0 ? "+" : "") + (v * 100).toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
const fmtPP = v => (v > 0 ? "+" : "") + (v * 100).toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " pp";
const d12 = d => new Date(d + "T12:00:00");
const fmtDate = d => d12(d).toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SIDE = { BUY: "Compra", ADD: "Amplía", TRIM: "Reduce", SELL: "Vende" };
const $ = id => document.getElementById(id);
let DATA, current = "calidad";

async function q(table, query) {
  const r = await fetch(`${cfg.SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: `Bearer ${cfg.SUPABASE_ANON_KEY}` }
  });
  if (!r.ok) throw new Error(`${table}: ${r.status}`);
  return r.json();
}

async function load() {
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return demoData();
  const [states, nav, positions, trades, reports] = await Promise.all([
    q("fund_state", "select=*"),
    q("nav_history", "select=*&order=date.asc"),
    q("positions", "select=*"),
    q("trades", "select=*&order=id.desc&limit=300"),
    q("daily_reports", "select=*&order=date.desc&limit=20"),
  ]);
  const out = { demo: false, funds: {} };
  for (const f of Object.keys(FUNDS)) {
    out.funds[f] = {
      state: states.find(s => s.fund_id === f),
      nav: nav.filter(n => n.fund_id === f),
      positions: positions.filter(p => p.fund_id === f),
      trades: trades.filter(t => t.fund_id === f).slice(0, 60),
      report: reports.find(r => r.fund_id === f),
    };
  }
  return out;
}

function render() {
  const F = DATA.funds[current];
  const otherId = current === "calidad" ? "catalizadores" : "calidad";
  const { state, nav, positions, trades, report } = F;
  $("lg-sel").textContent = FUNDS[current];
  $("lg-other").textContent = FUNDS[otherId];
  $("lg-other").hidden = !DATA.funds[otherId].nav.length;
  if (!nav.length || !state) {
    $("verdict").textContent = "Aún sin sesiones";
    $("verdict").className = "verdict";
    $("verdict-sub").textContent = "Este fondo aparecerá aquí tras su primera ejecución diaria.";
    $("figures").innerHTML = ""; $("chart").innerHTML = ""; $("stamp").textContent = "";
    ["view", "notes", "report-date", "port-lede"].forEach(id => $(id).textContent = "");
    ["moves", "pending", "positions", "trades"].forEach(id => $(id).innerHTML = "");
    $("pending-title").hidden = true;
    return;
  }
  const first = nav[0], last = nav[nav.length - 1];
  const fundRet = last.nav / state.initial_capital - 1;
  const ijrRet = last.bench.IJR / first.bench.IJR - 1;
  const iwmRet = last.bench.IWM / first.bench.IWM - 1;
  const alpha = fundRet - ijrRet;
  const prev = nav.length > 1 ? nav[nav.length - 2].nav : state.initial_capital;

  $("stamp").textContent = `Última sesión: ${fmtDate(last.date)}`;
  $("verdict").textContent = `${fmtPP(alpha)} frente al S&P 600`;
  $("verdict").className = "verdict " + (alpha >= 0 ? "up" : "down");
  $("verdict-sub").textContent =
    `Desde el ${fmtDate(first.date)}, el fondo ${fundRet >= 0 ? "gana" : "pierde"} ${fmtPct(Math.abs(fundRet), false)} y el índice de referencia ${ijrRet >= 0 ? "gana" : "pierde"} ${fmtPct(Math.abs(ijrRet), false)}.`;

  // Caída máxima
  let peak = -Infinity, mdd = 0;
  for (const n of nav) { peak = Math.max(peak, n.nav); mdd = Math.min(mdd, n.nav / peak - 1); }
  $("figures").innerHTML = [
    ["Patrimonio", fmtUSD.format(last.nav), ""],
    ["Hoy", fmtPct(last.nav / prev - 1), cls(last.nav / prev - 1)],
    ["Caída máxima", fmtPct(mdd), cls(mdd)],
    ["Russell 2000", fmtPct(iwmRet), cls(iwmRet)],
  ].map(([k, val, c]) => `<div><dt>${k}</dt><dd class="${c}">${val}</dd></div>`).join("");

  drawChart(F, DATA.funds[otherId]);

  // Decisión del día
  $("report-date").textContent = report ? fmtDate(report.date) : "";
  $("view").textContent = report?.market_view || "";
  $("notes").textContent = report?.notes ? "Para vigilar: " + report.notes : "";
  const todays = trades.filter(t => report && t.date === report.date);
  $("moves").innerHTML = todays.length ? todays.map(t => `
    <li><div class="mv-head"><span class="side ${t.side}">${SIDE[t.side] || t.side}</span>${esc(t.ticker)}
    <span class="stamp">${fmtUSD.format(t.value)}</span>${t.auto ? '<span class="auto">automática</span>' : ""}</div>
    <div class="mv-reason">${esc(t.reason)}</div></li>`).join("")
    : '<li class="empty">Sin operaciones ejecutadas en esta sesión.</li>';
  const pend = state.pending || [];
  $("pending-title").hidden = !pend.length;
  $("pending").innerHTML = pend.map(o => `
    <li><div class="mv-head"><span class="side PEND">${SIDE[o.side] || o.side}</span>${esc(o.ticker)}
    ${o.weight ? `<span class="stamp">${fmtPct(o.weight, false)} del fondo</span>` : ""}${o.auto ? '<span class="auto">por reglas</span>' : ""}</div>
    <div class="mv-reason">${esc(o.reason)}</div></li>`).join("");

  // Cartera
  const total = last.nav, withStop = current === "catalizadores";
  const rows = positions.map(p => ({ ...p, value: p.shares * p.last_price, pnl: p.last_price / p.avg_cost - 1 }))
    .sort((a, b) => b.value - a.value);
  const maxW = Math.max(...rows.map(r => r.value / total), 0.01);
  $("port-lede").textContent = rows.length
    ? `${rows.length} posiciones y ${fmtPct(last.cash / last.nav, false)} en liquidez.`
    : "Sin posiciones abiertas: todo en liquidez.";
  $("positions").innerHTML = rows.length ? `<thead><tr><th>Empresa</th><th class="hide-sm">Sector</th>
    <th class="num">Peso</th><th class="num">Resultado</th>${withStop ? '<th class="num">Stop</th>' : ""}<th class="num hide-sm">Desde</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td><span class="tk">${esc(r.ticker)}</span> <span class="nm">${esc(r.name || "")}</span></td>
      <td class="hide-sm">${esc(r.sector || "")}</td>
      <td class="num">${fmtPct(r.value / total, false)}<span class="wbar" style="width:${Math.round(40 * (r.value / total) / maxW)}px"></span></td>
      <td class="num ${cls(r.pnl)}">${fmtPct(r.pnl)}</td>
      ${withStop ? `<td class="num">${fmtPx(r.stop)}</td>` : ""}
      <td class="num hide-sm">${r.opened_at ? d12(r.opened_at).toLocaleDateString("es-ES") : ""}</td></tr>`).join("") + "</tbody>" : "";

  $("trades").innerHTML = trades.length ? `<thead><tr><th>Fecha</th><th>Operación</th><th class="num">Importe</th><th>Motivo</th></tr></thead><tbody>` +
    trades.map(t => `<tr><td>${d12(t.date).toLocaleDateString("es-ES")}</td>
      <td><span class="side ${t.side}">${SIDE[t.side] || t.side}</span> <span class="tk">${esc(t.ticker)}</span></td>
      <td class="num">${fmtUSD.format(t.value)}</td><td class="reason">${esc(t.reason)}${t.auto ? '<span class="auto">automática</span>' : ""}</td></tr>`).join("") + "</tbody>"
    : '<tbody><tr><td class="empty">Todavía no hay operaciones.</td></tr></tbody>';
}

function drawChart(F, O) {
  const narrow = window.innerWidth < 600;
  const W = narrow ? 420 : 1000, H = narrow ? 300 : 320, L = 40, R = 8, T = 12, B = 28;
  $("chart").setAttribute("viewBox", `0 0 ${W} ${H}`);
  const dates = [...new Set([...F.nav, ...O.nav].map(n => n.date))].sort();
  const n = dates.length, ix = Object.fromEntries(dates.map((d, i) => [d, i]));
  const benchSrc = Object.fromEntries([...O.nav, ...F.nav].map(r => [r.date, r.bench]));
  const b0 = benchSrc[dates[0]];
  const series = (nav, init) => nav.map(r => [ix[r.date], 100 * r.nav / init]);
  const s = {
    sel: series(F.nav, F.state.initial_capital),
    oth: O.state ? series(O.nav, O.state.initial_capital) : [],
    ijr: dates.map((d, i) => [i, 100 * benchSrc[d].IJR / b0.IJR]),
    iwm: dates.map((d, i) => [i, 100 * benchSrc[d].IWM / b0.IWM]),
  };
  const all = [...s.sel, ...s.oth, ...s.ijr, ...s.iwm].map(p => p[1]);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = Math.max((hi - lo) * 0.1, 1); lo -= pad; hi += pad;
  const x = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const path = arr => arr.map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [], step = niceStep((hi - lo) / 4);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const dateTicks = n > 1 ? [0, Math.floor((n - 1) / 2), n - 1] : [0];
  const svg = $("chart");
  svg.innerHTML = `
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="${v === 100 ? 1.5 : 1}"/>
      <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v.toLocaleString("es-ES")}</text>`).join("")}
    <path d="${path(s.iwm)}" fill="none" stroke="var(--bench2)" stroke-width="1.6"/>
    <path d="${path(s.ijr)}" fill="none" stroke="var(--bench)" stroke-width="1.8"/>
    ${s.oth.length ? `<path d="${path(s.oth)}" fill="none" stroke="var(--other)" stroke-width="1.8" stroke-dasharray="5 4"/>` : ""}
    <path class="line-fund" d="${path(s.sel)}" fill="none" stroke="var(--fund)" stroke-width="2.6" stroke-linejoin="round"/>
    ${dateTicks.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${d12(dates[i]).toLocaleDateString("es-ES", { day: "numeric", month: "short" })}</text>`).join("")}`;
  const fl = svg.querySelector(".line-fund");
  if (fl) fl.style.setProperty("--len", fl.getTotalLength());
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

function demoData() {
  const days = 90; let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280 - 0.5;
  const dates = [], bench = [];
  let a = 210, b = 225;
  for (let d = new Date(Date.now() - days * 1.45 * 864e5); dates.length < days; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const m = rnd() * 0.022; a *= 1 + m + 0.0003; b *= 1 + m * 1.15 + 0.0001;
    dates.push(d.toISOString().slice(0, 10)); bench.push({ IJR: a, IWM: b, m });
  }
  let q = 100000, c = 100000;
  const navQ = [], navC = [];
  dates.forEach((d, i) => {
    q *= 1 + bench[i].m * 0.85 + rnd() * 0.006 + 0.0006;
    c *= 1 + bench[i].m * 1.3 + rnd() * 0.03 + 0.0009;
    navQ.push({ date: d, nav: q, cash: q * 0.035, bench: bench[i] });
    navC.push({ date: d, nav: c, cash: c * 0.4, bench: bench[i] });
  });
  const last = dates[dates.length - 1];
  const pos = (arr, total, extra = {}) => arr.map(([t, n, s, w, p, stop]) => {
    const px = 20, v = w * total;
    return { ticker: t, name: n, sector: s, shares: v / px, last_price: px, avg_cost: px / (1 + p), opened_at: dates[5], stop, ...extra };
  });
  return {
    demo: true, funds: {
      calidad: {
        state: { initial_capital: 100000, pending: [] }, nav: navQ,
