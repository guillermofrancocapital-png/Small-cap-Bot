name: Fondos small caps diarios

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocesar la última sesión aunque ya exista"
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'smallcap-bot demo contacto@example.com' }}
      MANAGER_MODE: ${{ vars.MANAGER_MODE || 'claude' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
      FORCE: ${{ github.event.inputs.force || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fondo calidad + valor
        id: calidad
        continue-on-error: true
        run: python -m bot.run_daily
      - name: Fondo catalizadores
        id: catalizadores
        continue-on-error: true
        run: python -m bot.catalyst
      - name: Marcar fallo si algún fondo falló
        if: steps.calidad.outcome == 'failure' || steps.catalizadores.outcome == 'failure'
        run: exit 1
